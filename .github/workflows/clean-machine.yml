name: Clean-machine candidate trials

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/clean-machine.yml
      - Cargo.lock
      - Cargo.toml
      - migrations/**
      - scripts/clean-machine-trials.sh
      - scripts/release-smoke.sh
      - scripts/verify_clean_machine_evidence.py
      - scripts/test_verify_clean_machine_evidence.py
      - src/**

permissions:
  contents: read

concurrency:
  group: clean-machine-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: '0'

jobs:
  build:
    name: Build ${{ matrix.target }} candidate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            expected_arch: x86_64
          - target: aarch64-apple-darwin
            runner: macos-15
            expected_arch: arm64
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Confirm the native builder architecture
        shell: bash
        run: test "$(uname -m)" = "${{ matrix.expected_arch }}"

      - name: Install the pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.91.0 --profile minimal

      - name: Build the locked release candidate
        shell: bash
        run: cargo +1.91.0 build --locked --release --bin hsum

      - name: Freeze the candidate and checksum
        env:
          SOURCE_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_COMMIT_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          checkout_sha=$(git rev-parse HEAD)
          tree_sha=$(git rev-parse 'HEAD^{tree}')
          test "$checkout_sha" = "$GITHUB_SHA"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            test "$(git rev-parse HEAD^1)" = "$BASE_COMMIT_SHA"
            test "$(git rev-parse HEAD^2)" = "$SOURCE_COMMIT_SHA"
          fi
          mkdir candidate
          cp target/release/hsum candidate/hsum
          chmod 755 candidate/hsum
          (
            cd candidate
            shasum -a 256 hsum > hsum.sha256
          )
          file candidate/hsum > candidate/file.txt
          candidate/hsum --version --verbose > candidate/version.txt
          printf '%s\n' "$checkout_sha" > candidate/checkout-commit-sha.txt
          printf '%s\n' "$SOURCE_COMMIT_SHA" > candidate/source-commit-sha.txt
          printf '%s\n' "$BASE_COMMIT_SHA" > candidate/base-commit-sha.txt
          printf '%s\n' "$tree_sha" > candidate/tree-sha.txt

      - name: Upload the frozen candidate
        uses: actions/upload-artifact@v7
        with:
          name: clean-machine-candidate-${{ matrix.target }}
          path: candidate
          if-no-files-found: error
          compression-level: 0

  trials:
    name: Trial ${{ matrix.target }} candidate on a fresh runner
    needs: build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            expected_arch: x86_64
          - target: aarch64-apple-darwin
            runner: macos-15
            expected_arch: arm64
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Confirm the fresh trial runner architecture
        shell: bash
        run: test "$(uname -m)" = "${{ matrix.expected_arch }}"

      - name: Download the prebuilt candidate
        uses: actions/download-artifact@v8
        with:
          name: clean-machine-candidate-${{ matrix.target }}
          path: candidate

      - name: Verify candidate identity without rebuilding
        env:
          SOURCE_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_COMMIT_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat candidate/checkout-commit-sha.txt)" = "$GITHUB_SHA"
          test "$(cat candidate/source-commit-sha.txt)" = "$SOURCE_COMMIT_SHA"
          test "$(cat candidate/base-commit-sha.txt)" = "$BASE_COMMIT_SHA"
          test "$(cat candidate/tree-sha.txt)" = "$(git rev-parse 'HEAD^{tree}')"
          chmod 755 candidate/hsum
          (
            cd candidate
            shasum -a 256 -c hsum.sha256
          )
          test "$(find target -type f -name hsum -print -quit 2>/dev/null || true)" = ""

      - name: Run the frozen five-trial CLI and MCP protocol
        env:
          HSUM_OFFLINE: '1'
          HSUM_CANDIDATE_COMMIT_SHA: ${{ github.sha }}
          HSUM_CANDIDATE_SOURCE_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          HSUM_CANDIDATE_BASE_COMMIT_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        shell: bash
        run: |
          HSUM_CANDIDATE_TREE_SHA=$(cat candidate/tree-sha.txt) \
            bash scripts/clean-machine-trials.sh \
            "$PWD/candidate/hsum" \
            "$RUNNER_TEMP/clean-machine-evidence"

      - name: Upload immutable trial evidence
        uses: actions/upload-artifact@v7
        with:
          name: clean-machine-evidence-${{ matrix.target }}
          path: ${{ runner.temp }}/clean-machine-evidence
          if-no-files-found: error
          compression-level: 9

  compare:
    name: Compare both clean-machine targets
    needs: trials
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download all native evidence
        uses: actions/download-artifact@v8
        with:
          pattern: clean-machine-evidence-*
          path: evidence

      - name: Require five passing trials on each supported target
        env:
          EXPECTED_CHECKOUT_SHA: ${{ github.sha }}
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        shell: bash
        run: |
          python3 scripts/test_verify_clean_machine_evidence.py
          python3 scripts/verify_clean_machine_evidence.py \
            --evidence-root evidence \
            --checkout-sha "$EXPECTED_CHECKOUT_SHA" \
            --source-sha "$EXPECTED_SOURCE_SHA" \
            --base-sha "$EXPECTED_BASE_SHA" \
            --tree-sha "$(git rev-parse 'HEAD^{tree}')" \
            --run-id "$GITHUB_RUN_ID"
