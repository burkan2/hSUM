name: Model portability

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/model-portability.yml
      - Cargo.lock
      - Cargo.toml
      - assets/models/**
      - benches/model_portability/inputs.json
      - examples/model-portability-compare.rs
      - examples/model-portability.rs
      - migrations/0004_vector_storage.sql
      - scripts/semantic-product-smoke.sh
      - src/app/search_evidence.rs
      - src/cli.rs
      - src/mcp.rs
      - src/model/**
      - src/protocol/**
      - src/runtime.rs
      - src/search/retrieval.rs
      - src/store/vector.rs

permissions:
  contents: read

concurrency:
  group: model-portability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fastembed-cpu:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-24.04
            expected_arch: x86_64
            dependency_command: ldd
          - name: macOS arm64
            runner: macos-15
            expected_arch: arm64
            dependency_command: otool -L
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Prepare runner-local evidence paths
        shell: bash
        run: |
          {
            echo "HSUM_HOME=$RUNNER_TEMP/hsum-model-portability"
            echo "REPORT_PATH=$RUNNER_TEMP/model-portability-${{ matrix.expected_arch }}.json"
            echo "DEPENDENCIES_PATH=$RUNNER_TEMP/model-portability-${{ matrix.expected_arch }}-dependencies.txt"
            echo "PRODUCT_REPORT_PATH=$RUNNER_TEMP/semantic-product-${{ matrix.expected_arch }}.json"
          } >> "$GITHUB_ENV"

      - name: Confirm the native runner architecture
        shell: bash
        run: test "$(uname -m)" = "${{ matrix.expected_arch }}"

      - name: Install the pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.91.0 --profile minimal

      - name: Build the network-capable model installer
        shell: bash
        run: cargo +1.91.0 build --locked --release --bin hsum

      - name: Install and verify the exact pinned model artifact
        shell: bash
        run: |
          target/release/hsum model install embedding bge-small-en-v1-5-fp32 \
            --no-progress --json
          target/release/hsum model verify bge-small-en-v1-5-fp32 --json

      - name: Build the opt-in FastEmbed CPU probe
        shell: bash
        run: |
          cargo +1.91.0 build --locked --release \
            --features model-portability --example model-portability

      - name: Record executable format and dynamic dependencies
        shell: bash
        run: |
          {
            file target/release/examples/model-portability
            ${{ matrix.dependency_command }} target/release/examples/model-portability
          } > "$DEPENDENCIES_PATH"

      - name: Run the fixed protocol without model-network access
        env:
          HSUM_OFFLINE: "1"
        shell: bash
        run: |
          target/release/examples/model-portability \
            --output "$REPORT_PATH"
          python3 -c 'import json,os; report=json.load(open(os.environ["REPORT_PATH"], encoding="utf-8")); assert report["passed"] is True'

      - name: Exercise the native semantic product path without model-network access
        env:
          HSUM_OFFLINE: "1"
        shell: bash
        run: |
          bash scripts/semantic-product-smoke.sh \
            "$PWD/target/release/hsum" \
            "$PRODUCT_REPORT_PATH"

      - name: Upload machine-readable portability evidence
        uses: actions/upload-artifact@v7
        with:
          name: model-portability-${{ matrix.expected_arch }}
          path: |
            ${{ env.REPORT_PATH }}
            ${{ env.DEPENDENCIES_PATH }}
            ${{ env.PRODUCT_REPORT_PATH }}
          if-no-files-found: error
          compression-level: 0

  numerical-compatibility:
    name: Cross-architecture numerical compatibility
    needs: fastembed-cpu
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.91.0 --profile minimal

      - name: Download Linux x86_64 evidence
        uses: actions/download-artifact@v8
        with:
          name: model-portability-x86_64
          path: evidence/x86_64

      - name: Download macOS arm64 evidence
        uses: actions/download-artifact@v8
        with:
          name: model-portability-arm64
          path: evidence/arm64

      - name: Build the preregistered numerical comparator
        shell: bash
        run: |
          cargo +1.91.0 build --locked --release \
            --example model-portability-compare

      - name: Compare the native semantic product contract
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib

          reports = {}
          for architecture in ("x86_64", "arm64"):
              path = pathlib.Path(f"evidence/{architecture}/semantic-product-{architecture}.json")
              raw = path.read_bytes()
              report = json.loads(raw)
              assert report["schema_version"] == "hsum.semantic-product-smoke.v1"
              assert report["passed"] is True
              assert report["offline"] is True
              assert report["platform"]["machine"] == architecture
              reports[architecture] = (report, hashlib.sha256(raw).hexdigest())

          linux, linux_sha256 = reports["x86_64"]
          macos, macos_sha256 = reports["arm64"]
          assert linux["commit_sha"] == macos["commit_sha"]
          assert linux["model"] == macos["model"]
          assert linux["cli"] == macos["cli"]
          assert linux["mcp"] == macos["mcp"]
          assert linux["immutable_get_verified"] is True
          assert macos["immutable_get_verified"] is True

          output = {
              "schema_version": "hsum.semantic-product-cross-target.v1",
              "passed": True,
              "commit_sha": linux["commit_sha"],
              "model": linux["model"],
              "cli": linux["cli"],
              "mcp": linux["mcp"],
              "reports": {
                  "linux_x86_64_sha256": linux_sha256,
                  "macos_arm64_sha256": macos_sha256,
              },
          }
          destination = pathlib.Path(os.environ["RUNNER_TEMP"]) / "semantic-product-cross-target.json"
          destination.write_text(
              json.dumps(output, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Compare every recorded float and deterministic ordering
        shell: bash
        run: |
          target/release/examples/model-portability-compare \
            evidence/x86_64/model-portability-x86_64.json \
            evidence/arm64/model-portability-arm64.json \
            --output "$RUNNER_TEMP/model-numerical-compatibility.json"

      - name: Upload numerical compatibility evidence
        uses: actions/upload-artifact@v7
        with:
          name: model-numerical-compatibility
          path: |
            ${{ runner.temp }}/model-numerical-compatibility.json
            ${{ runner.temp }}/semantic-product-cross-target.json
          if-no-files-found: error
          compression-level: 0
